<svg xmlns="http://www.w3.org/2000/svg" width="2172" height="724" viewBox="0 0 2172 724" role="img" aria-labelledby="t d" font-family="Noto Sans, Inter, system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="t">@oidfed/wallet</title>
  <desc id="d">Wallet Trust, Backed by Federation. Wallet Provider, Credential Issuer, and Credential Verifier roles for OpenID Federation for Wallet Architectures.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="2172" y2="724" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbfcfe"/>
      <stop offset="0.45" stop-color="#f6f9fd"/>
      <stop offset="1" stop-color="#eef4fb"/>
    </linearGradient>

    <linearGradient id="head" x1="608" y1="300" x2="1548" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1552cf"/>
      <stop offset="0.52" stop-color="#1877d6"/>
      <stop offset="1" stop-color="#19a6bb"/>
    </linearGradient>

    <linearGradient id="mark" x1="176" y1="278" x2="328" y2="382" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3391ea"/>
      <stop offset="0.5" stop-color="#1b74d8"/>
      <stop offset="1" stop-color="#1596c6"/>
    </linearGradient>

    <linearGradient id="markSm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3391ea"/>
      <stop offset="1" stop-color="#19a6bb"/>
    </linearGradient>

    <linearGradient id="card2" x1="186" y1="222" x2="318" y2="304" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#cfe6fa"/>
      <stop offset="1" stop-color="#dff0f6"/>
    </linearGradient>

    <linearGradient id="wave" x1="1640" y1="240" x2="2172" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#dcebfa" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#d8e9f8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#e6f3f7" stop-opacity="0.35"/>
    </linearGradient>

    <radialGradient id="pedestal" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7ec8f5" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#9ad6f0" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#cfeaf8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#9fd4f7" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#cfe8fa" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ac8f2" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#bfe6f8" stop-opacity="0"/>
    </linearGradient>

    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="softer" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="lift" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#0f3763" flood-opacity="0.12"/>
    </filter>

    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0H0V46" fill="none" stroke="#cddff1" stroke-width="1"/>
    </pattern>

    <symbol id="hexOutline" viewBox="0 0 100 112">
      <path d="M50 2 96 29v54L50 110 4 83V29L50 2Z" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round"/>
    </symbol>
  </defs>

