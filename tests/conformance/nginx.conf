events {}
http {
    access_log off;
    large_client_header_buffers 4 64k;
    server {
        listen 8443 ssl;
        server_name suite.ofed.test;
        ssl_certificate /run/oidfed/tls.pem;
        ssl_certificate_key /run/oidfed/tls-key.pem;
        client_max_body_size 2m;
        location / {
            proxy_pass http://suite:8080;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 300s;
        }
    }
}
