services:
  mongo:
    image: mongo:7.0@sha256:b096b4cb9269f3ebcf363be63f1c50920f786879d03a1890347a3bf33f1f0df0
  suite:
    image: eclipse-temurin:21@sha256:89b79b86b989519a440f71bff294ac4c0498c5fed46810d535a4f3472913d90b
    volumes:
      - ${OIDF_SOURCE}/target/fapi-test-suite.jar:/suite.jar:ro
      - ${OIDF_STATE}:/run/oidfed:ro
    command:
      - sh
      - -ec
      - >-
        cp /opt/java/openjdk/lib/security/cacerts /tmp/oidf-cacerts;
        keytool -importcert -noprompt -alias oidfed-test-ca -file /run/oidfed/ca.pem -keystore /tmp/oidf-cacerts -storepass changeit;
        exec java -Djavax.net.ssl.trustStore=/tmp/oidf-cacerts -Djavax.net.ssl.trustStorePassword=changeit -jar /suite.jar
        --spring.profiles.active=dev --spring.mongodb.uri=mongodb://mongo:27017/test_suite
        --fintechlabs.base_url=https://suite.ofed.test:8443 --fintechlabs.base_mtls_url=https://suite.ofed.test:8443
    depends_on: [mongo]
  proxy:
    image: nginx:1.28-bookworm@sha256:552e7481ca93ffccd046aa658dbbed22caefbc09c66fa7cd247cbb90b8a5c609
    volumes:
      - ${OIDF_ROOT}/tests/conformance/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${OIDF_STATE}:/run/oidfed:ro
    networks:
      default:
        aliases: [suite.ofed.test]
    depends_on: [suite]
  fixtures:
    image: ${OIDF_RUNNER}
    user: "${OIDF_UID}:${OIDF_GID}"
    volumes:
      - ${OIDF_ROOT}:/work:ro
      - ${OIDF_STATE}:/run/oidfed
    environment:
      NODE_EXTRA_CA_CERTS: /run/oidfed/ca.pem
    command: [node, node_modules/tsx/dist/cli.mjs, --tsconfig, tests/conformance/tsconfig.json, tests/conformance/fixtures.ts]
    networks:
      default:
        aliases: [ta.ofed.test, ia.ofed.test, leaf.ofed.test, op.ofed.test, rp.ofed.test]
  driver:
    image: ${OIDF_RUNNER}
    user: "${OIDF_UID}:${OIDF_GID}"
    volumes:
      - ${OIDF_ROOT}:/work:ro
      - ${OIDF_SOURCE}:/suite:ro
      - ${OIDF_STATE}:/run/oidfed
      - ${OIDF_RESULTS}:/results
    environment:
      PYTHONPATH: /suite/scripts
      SSL_CERT_FILE: /run/oidfed/ca.pem
      CONFORMANCE_RETRY_TIMEOUT: "10"
    command: [python, tests/conformance/driver.py, --profile, "${OIDF_PROFILE}"]
    depends_on: [proxy, fixtures]
