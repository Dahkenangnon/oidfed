name: OpenID Federation conformance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '27 3 * * *'
  workflow_dispatch:
    inputs:
      profile:
        description: OpenID Federation conformance profile
        type: choice
        options: [deployed, rp, op, full]
        default: full

permissions:
  contents: read

concurrency:
  group: oidf-conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  federation:
    name: OpenID Federation conformance (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(github.event_name == 'pull_request' && '["deployed"]' || github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.profile) || '["deployed","rp","op"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck:conformance
      - run: pnpm test:conformance:unit
      - name: Run pinned OpenID Federation test plans
        env:
          PROFILE: ${{ matrix.profile }}
        run: pnpm exec tsx --tsconfig tests/conformance/tsconfig.json tests/conformance/run.ts --profile "$PROFILE"
      - name: Upload sanitized reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: oidf-conformance-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .conformance/runs/*/results/*.json
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
