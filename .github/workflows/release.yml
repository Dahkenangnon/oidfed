name: Release

on:
  push:
    tags:
      - 'core/v*.*.*'
      - 'authority/v*.*.*'
      - 'leaf/v*.*.*'
      - 'oidc/v*.*.*'
      - 'wallet/v*.*.*'
      - 'cli/v*.*.*'
      - 'all/v*.*.*'

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate, publish & release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      # Run a fresh npm CLI for trusted publishing without self-upgrading Node's bundled npm.
      - run: pnpm --package=npm@latest dlx npm --version

      - run: pnpm install --frozen-lockfile

      - name: Parse tag
        id: tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          SCOPE="${REF_NAME%%/v*}"
          VERSION="${REF_NAME#*/v}"
          echo "scope=$SCOPE"   >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Build only the package(s) that are being released
      - name: Build
        env:
          SCOPE: ${{ steps.tag.outputs.scope }}
        run: |
          if [ "$SCOPE" = "all" ]; then
            pnpm build:publish
          else
            PKG="@oidfed/$SCOPE"
            # cli lives under tools/cli but is published as @oidfed/cli
            pnpm turbo run build --filter="$PKG"
          fi

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm quick:test

      - name: Verify @oidfed/core single-copy guarantee
        run: node scripts/check-single-core.mjs

      - name: Run repo scripts tests
        run: pnpm test:scripts

      - name: Verify packed package manifests
        env:
          SCOPE: ${{ steps.tag.outputs.scope }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: node scripts/check-pack-manifests.mjs --scope "$SCOPE" --expected-version "$VERSION"

      - name: Determine previous tag for compare link
        id: prev
        run: |
          SCOPE="${{ steps.tag.outputs.scope }}"
          PREV=$(git tag --list "${SCOPE}/v*" --sort=-v:refname | sed -n '2p')
          echo "tag=$PREV" >> "$GITHUB_OUTPUT"

      - name: Extract changelog body
        env:
          SCOPE: ${{ steps.tag.outputs.scope }}
          VERSION: ${{ steps.tag.outputs.version }}
          PREV_TAG: ${{ steps.prev.outputs.tag }}
        run: node scripts/extract-changelog.mjs "$SCOPE" "$VERSION" "$PREV_TAG" > RELEASE_BODY.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: '${{ steps.tag.outputs.scope }} v${{ steps.tag.outputs.version }}'
          body_path: RELEASE_BODY.md
          generate_release_notes: false

      - name: Publish to npm with provenance via trusted publishing
        env:
          SCOPE: ${{ steps.tag.outputs.scope }}
        run: |
          set -euo pipefail
          publish_one() {
            local dir="$1"
            pushd "$dir" >/dev/null
            pnpm pack
            local tgz
            tgz=$(ls -t ./*.tgz | head -1)
            pnpm --package=npm@latest dlx npm publish "$tgz" --provenance --access public
            popd >/dev/null
          }
          if [ "$SCOPE" = "all" ]; then
            publish_one packages/core
            publish_one packages/authority
            publish_one packages/leaf
            publish_one packages/oidc
            publish_one packages/wallet
            publish_one tools/cli
          else
            case "$SCOPE" in
              cli) dir=tools/cli ;;
              *)   dir=packages/"$SCOPE" ;;
            esac
            publish_one "$dir"
          fi
