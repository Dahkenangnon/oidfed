name: Release

on:
  push:
    tags:
      - 'core/v*.*.*'
      - 'authority/v*.*.*'
      - 'leaf/v*.*.*'
      - 'oidc/v*.*.*'
      - 'wallet/v*.*.*'
      - 'cli/v*.*.*'
  workflow_dispatch:
    inputs:
      scope:
        description: Package selection for a new release
        type: choice
        options: [all, core, authority, leaf, oidc, wallet, cli]
        default: all
      source_sha:
        description: Reviewed commit on main (required for a new release)
        type: string
      resume_run_id:
        description: Resume a saved release run instead of building new archives
        type: string

permissions:
  contents: read

env:
  RELEASE_SCOPE: ${{ inputs.scope }}
  SOURCE_SHA: ${{ inputs.source_sha }}
  RESUME_RUN_ID: ${{ inputs.resume_run_id }}

jobs:
  verify:
    name: Verify and package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      origin_run_id: ${{ steps.source.outputs.origin_run_id }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Validate release source or restore verified archives
        id: source
        run: node scripts/release/workflow.mjs source
      - name: Check out the reviewed package source
        if: ${{ !inputs.resume_run_id }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - if: ${{ !inputs.resume_run_id }}
        run: pnpm install --frozen-lockfile
      - if: ${{ !inputs.resume_run_id }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Build and verify the source
        if: ${{ !inputs.resume_run_id }}
        run: |
          pnpm build:publish
          pnpm lint
          pnpm typecheck
          pnpm test:coverage
          pnpm --filter './tools/*' test
          pnpm test:scripts
          node scripts/check-single-core.mjs
      - name: Pack the release archives once
        if: ${{ !inputs.resume_run_id }}
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: node scripts/release/workflow.mjs package
      - name: Check source and the saved archives
        if: ${{ !inputs.resume_run_id }}
        env:
          RELEASE_ARTIFACT_DIR: ${{ runner.temp }}/release-bundle
        run: |
          pnpm security:install
          pnpm security:check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle
          path: ${{ runner.temp }}/release-bundle/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish verified archives
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    concurrency:
      group: npm-publication
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
      ORIGIN_RUN_ID: ${{ needs.verify.outputs.origin_run_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: ${{ runner.temp }}/release-bundle
      - run: node scripts/release/workflow.mjs publish

  complete:
    name: Complete package releases
    needs: [verify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
      ORIGIN_RUN_ID: ${{ needs.verify.outputs.origin_run_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: ${{ runner.temp }}/release-bundle
      - run: node scripts/release/workflow.mjs complete
