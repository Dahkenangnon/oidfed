version: 2

updates:
  # pnpm workspace dependencies; use the root manifest and shared lockfile together
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps)"
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions, still lives at repo root because workflows are in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps)"
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
